<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="100%" role="img" aria-label="CyclePatrol 1.6 changes: the ten attack modules are unchanged since 1.3; 1.6 adds a proof and verification layer and new report views" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="960" height="452" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="451" rx="14" fill="none" stroke="#e4e4e4"/>

  <!-- title + legend -->
  <text x="28" y="36" font-size="16" font-weight="700" fill="#0a0a0a">CyclePatrol 1.6: what changed vs 1.3</text>
  <g font-size="11" transform="translate(620,27)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="18" y="10" fill="#595959">unchanged</text>
    <rect x="110" y="0" width="12" height="12" rx="3" fill="#fdeaec" stroke="#c1121f"/>
    <text x="128" y="10" fill="#c1121f">new in 1.6</text>
  </g>
  <line x1="28" y1="50" x2="932" y2="50" stroke="#ececec"/>

  <!-- column headers -->
  <text x="28"  y="76" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#595959">ATTACK MODULES &#183; 10</text>
  <text x="352" y="76" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#c1121f">PROOF &amp; VERIFY</text>
  <text x="664" y="76" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#c1121f">REPORT</text>

  <!-- Column 1: attacks (unchanged) -->
  <g font-size="11.5">
    <rect x="28" y="88" width="268" height="70" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="44" y="110" font-weight="700" fill="#0a0a0a">WPS</text>
    <text x="44" y="128" fill="#595959">pixie, vendor, null,</text>
    <text x="44" y="145" fill="#595959">empty, user_pin</text>

    <rect x="28" y="170" width="268" height="70" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="44" y="192" font-weight="700" fill="#0a0a0a">Capture</text>
    <text x="44" y="210" fill="#595959">pmkid, pmkid_active,</text>
    <text x="44" y="227" fill="#595959">eapol, deauth_handshake</text>

    <rect x="28" y="252" width="268" height="54" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="44" y="274" font-weight="700" fill="#0a0a0a">Key recovery</text>
    <text x="44" y="292" fill="#595959">wpa_psk_brute, offline_crack</text>

    <rect x="28" y="318" width="268" height="54" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="44" y="340" font-weight="700" fill="#0a0a0a">Enterprise</text>
    <text x="44" y="358" fill="#595959">wpa_enterprise_eviltwin</text>
  </g>

  <!-- Column 2: proof + verify (new) -->
  <g font-size="11">
    <rect x="352" y="88" width="264" height="70" rx="10" fill="#fdeaec" stroke="#c1121f"/>
    <text x="368" y="110" font-weight="700" fill="#c1121f">Proof-gated severity</text>
    <text x="368" y="128" fill="#8a1218">Critical only with a proof</text>
    <text x="368" y="145" fill="#8a1218">file. _gate_sev</text>

    <rect x="352" y="170" width="264" height="70" rx="10" fill="#fdeaec" stroke="#c1121f"/>
    <text x="368" y="192" font-weight="700" fill="#c1121f">Live key verify</text>
    <text x="368" y="210" fill="#8a1218">one-shot association,</text>
    <text x="368" y="227" fill="#8a1218">rejects empty captures</text>

    <rect x="352" y="252" width="264" height="54" rx="10" fill="#fdeaec" stroke="#c1121f"/>
    <text x="368" y="274" font-weight="700" fill="#c1121f">Chain of custody</text>
    <text x="368" y="292" fill="#8a1218">proofs.jsonl, SHA-256 each</text>

    <rect x="352" y="318" width="264" height="54" rx="10" fill="#fdeaec" stroke="#c1121f"/>
    <text x="368" y="340" font-weight="700" fill="#c1121f">Posture + evidence</text>
    <text x="368" y="358" fill="#8a1218">Low/Info carry beacon facts</text>
  </g>

  <!-- Column 3: report (new) -->
  <g font-size="11">
    <rect x="664" y="88" width="268" height="54" rx="10" fill="#0a0a0a"/>
    <text x="680" y="110" font-weight="700" fill="#ffffff">Simple / Technical views</text>
    <text x="680" y="128" fill="#c9c9c9">client view, toggle to detail</text>

    <rect x="664" y="154" width="268" height="48" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="680" y="174" font-weight="700" fill="#0a0a0a">Signal analysis</text>
    <text x="680" y="191" fill="#595959">RSSI chart + histogram</text>

    <rect x="664" y="214" width="268" height="48" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="680" y="234" font-weight="700" fill="#0a0a0a">Channel map</text>
    <text x="680" y="251" fill="#595959">APs per channel by band</text>

    <rect x="664" y="274" width="268" height="48" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="680" y="294" font-weight="700" fill="#0a0a0a">Diagnostic logs</text>
    <text x="680" y="311" fill="#595959">from events.jsonl</text>

    <rect x="664" y="334" width="268" height="54" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="680" y="354" font-weight="700" fill="#0a0a0a">Short A2 console</text>
    <text x="680" y="372" fill="#595959">few-word lines, watch table</text>
  </g>

  <!-- flow -->
  <g stroke="#9a9a9a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M296 215 H350"/>
    <path d="M616 215 H662"/>
  </g>
  <text x="28" y="408" font-size="10.5" fill="#8a8a8a">Same ten attacks as 1.3. 1.6 adds how each result is proven and shown. Source: cp.sh (grep of attack_* and report functions).</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9a9a9a"/></marker>
  </defs>
</svg>
