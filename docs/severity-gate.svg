<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" role="img" aria-label="How a finding gets its severity: a finding is Critical only when a key was recovered and a non-empty proof file exists, otherwise it stays a Low or Info posture note" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="340" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="none" stroke="#e4e4e4"/>
  <text x="28" y="34" font-size="16" font-weight="700" fill="#0a0a0a">How a finding gets its severity</text>
  <text x="28" y="53" font-size="11.5" fill="#595959">Critical is earned, not guessed. It needs a recovered key and a proof file on disk.</text>

  <g font-size="12">
    <!-- start -->
    <rect x="28" y="92" width="170" height="56" rx="10" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="113" y="117" text-anchor="middle" font-weight="700" fill="#0a0a0a">Module ran</text>
    <text x="113" y="135" text-anchor="middle" font-size="10.5" fill="#595959">on one AP</text>

    <!-- Q1 key recovered -->
    <rect x="248" y="86" width="190" height="68" rx="10" fill="#fff" stroke="#0a0a0a"/>
    <text x="343" y="114" text-anchor="middle" font-weight="700" fill="#0a0a0a">Key recovered?</text>
    <text x="343" y="133" text-anchor="middle" font-size="10.5" fill="#595959">PIN or WPA key</text>

    <!-- Q2 proof file -->
    <rect x="488" y="86" width="190" height="68" rx="10" fill="#fff" stroke="#0a0a0a"/>
    <text x="583" y="109" text-anchor="middle" font-weight="700" fill="#0a0a0a">Proof file exists</text>
    <text x="583" y="127" text-anchor="middle" font-weight="700" fill="#0a0a0a">and not empty?</text>

    <!-- Critical -->
    <rect x="718" y="82" width="154" height="76" rx="10" fill="#c1121f"/>
    <text x="795" y="108" text-anchor="middle" font-weight="700" fill="#ffffff">CRITICAL</text>
    <text x="795" y="126" text-anchor="middle" font-size="10" fill="#ffd7db">proof_*.conf</text>
    <text x="795" y="140" text-anchor="middle" font-size="10" fill="#ffd7db">SHA-256 in proofs.jsonl</text>

    <!-- No key -> posture -->
    <rect x="248" y="226" width="190" height="72" rx="10" fill="#f5f5f5" stroke="#8a8a8a"/>
    <text x="343" y="252" text-anchor="middle" font-weight="700" fill="#0a0a0a">Posture note</text>
    <text x="343" y="270" text-anchor="middle" font-size="10.5" fill="#595959">Low or Info, with the</text>
    <text x="343" y="285" text-anchor="middle" font-size="10.5" fill="#595959">measured beacon facts</text>

    <!-- No proof -> not critical -->
    <rect x="488" y="226" width="190" height="72" rx="10" fill="#f5f5f5" stroke="#8a8a8a"/>
    <text x="583" y="252" text-anchor="middle" font-weight="700" fill="#0a0a0a">Not Critical</text>
    <text x="583" y="270" text-anchor="middle" font-size="10.5" fill="#595959">no evidence on disk,</text>
    <text x="583" y="285" text-anchor="middle" font-size="10.5" fill="#595959">so it is dropped</text>
  </g>

  <!-- arrows -->
  <g stroke="#595959" stroke-width="1.6" fill="none" marker-end="url(#a)" font-size="11">
    <path d="M198 120 H246"/>
    <path d="M438 120 H486"/>
    <path d="M678 120 H716"/>
    <path d="M343 154 V224"/>
    <path d="M583 154 V224"/>
  </g>
  <text x="452" y="114" font-size="10.5" fill="#0a0a0a" font-weight="700">yes</text>
  <text x="692" y="114" font-size="10.5" fill="#c1121f" font-weight="700">yes</text>
  <text x="352" y="196" font-size="10.5" fill="#8a8a8a" font-weight="700">no</text>
  <text x="592" y="196" font-size="10.5" fill="#8a8a8a" font-weight="700">no</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#595959"/></marker>
  </defs>
</svg>
