<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" role="img" aria-label="CyclePatrol pipeline: scan, parse, enrich, scope gate, assessment modules, proof and report" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="940" height="300" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="939" height="299" rx="14" fill="none" stroke="#e4e4e4"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0a0a0a">CyclePatrol pipeline</text>
  <text x="24" y="52" font-size="11.5" fill="#595959">one round of run_scan_loop, root, monitor-capable adapter</text>

  <!-- stage boxes -->
  <g font-size="12">
    <!-- Scan -->
    <rect x="24" y="78" width="150" height="58" rx="9" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="99" y="103" text-anchor="middle" font-weight="700" fill="#0a0a0a">Scan</text>
    <text x="99" y="121" text-anchor="middle" font-size="10.5" fill="#595959">scan_band, iw scan</text>

    <!-- Parse -->
    <rect x="200" y="78" width="150" height="58" rx="9" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="275" y="103" text-anchor="middle" font-weight="700" fill="#0a0a0a">Parse</text>
    <text x="275" y="121" text-anchor="middle" font-size="10.5" fill="#595959">parse_scan awk</text>

    <!-- Enrich -->
    <rect x="376" y="78" width="150" height="58" rx="9" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="451" y="103" text-anchor="middle" font-weight="700" fill="#0a0a0a">Enrich</text>
    <text x="451" y="121" text-anchor="middle" font-size="10.5" fill="#595959">OUI, chip, CVE, PMF</text>

    <!-- Scope gate (accent) -->
    <rect x="552" y="78" width="150" height="58" rx="9" fill="#fdeaec" stroke="#c1121f"/>
    <text x="627" y="103" text-anchor="middle" font-weight="700" fill="#c1121f">Scope gate</text>
    <text x="627" y="121" text-anchor="middle" font-size="10.5" fill="#8a1218">active_attack_permitted</text>

    <!-- Modules -->
    <rect x="728" y="78" width="188" height="58" rx="9" fill="#0a0a0a"/>
    <text x="822" y="103" text-anchor="middle" font-weight="700" fill="#ffffff">Assessment modules</text>
    <text x="822" y="121" text-anchor="middle" font-size="10" fill="#c9c9c9">WPS, PMKID, handshake, WPA2, EAP</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#595959" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M174 107 H198"/>
    <path d="M350 107 H374"/>
    <path d="M526 107 H550"/>
    <path d="M702 107 H726"/>
  </g>

  <!-- down to outputs -->
  <g font-size="12">
    <!-- Proof (accent) -->
    <rect x="552" y="196" width="150" height="58" rx="9" fill="#fdeaec" stroke="#c1121f"/>
    <text x="627" y="221" text-anchor="middle" font-weight="700" fill="#c1121f">Proof</text>
    <text x="627" y="239" text-anchor="middle" font-size="10.5" fill="#8a1218">save_proof, SHA-256</text>

    <!-- Report -->
    <rect x="376" y="196" width="150" height="58" rx="9" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="451" y="221" text-anchor="middle" font-weight="700" fill="#0a0a0a">Report</text>
    <text x="451" y="239" text-anchor="middle" font-size="10.5" fill="#595959">make_report, HTML</text>

    <!-- SAR -->
    <rect x="200" y="196" width="150" height="58" rx="9" fill="#f5f5f5" stroke="#d9d9d9"/>
    <text x="275" y="221" text-anchor="middle" font-weight="700" fill="#0a0a0a">Facts</text>
    <text x="275" y="239" text-anchor="middle" font-size="10.5" fill="#595959">sar.jsonl</text>
  </g>

  <!-- arrows row 2 -->
  <g stroke="#595959" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M822 136 V170 H627 V194"/>
    <path d="M627 254 V272 H451 V256"/>
    <path d="M451 196 V176 H275 V176 V194"/>
  </g>
  <text x="840" y="166" font-size="10" fill="#595959">key recovered</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#595959"/>
    </marker>
  </defs>
</svg>
