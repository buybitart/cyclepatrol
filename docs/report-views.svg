<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" role="img" aria-label="The report has two views: a Simple view for the client showing proof-backed findings, and a Technical view that adds posture findings, the evidence table, methodology, and the diagnostic log" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="360" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="14" fill="none" stroke="#e4e4e4"/>
  <text x="28" y="34" font-size="16" font-weight="700" fill="#0a0a0a">One report, two views</text>
  <text x="28" y="53" font-size="11.5" fill="#595959">The report opens Simple. A toggle turns on the Technical detail. Same HTML file.</text>

  <!-- toggle pill -->
  <g transform="translate(360,70)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#0a0a0a"/>
    <rect x="3" y="3" width="86" height="20" rx="10" fill="#ffffff"/>
    <text x="46" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">Simple</text>
    <text x="135" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Technical</text>
  </g>

  <!-- Simple column -->
  <rect x="28" y="112" width="400" height="214" rx="12" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="48" y="138" font-size="13" font-weight="700" fill="#0a0a0a">Simple view</text>
  <text x="48" y="156" font-size="11" fill="#595959">what the client sees</text>
  <g font-size="12" fill="#0a0a0a">
    <text x="48" y="186">&#8226; Critical findings, each with a proof file</text>
    <text x="48" y="212">&#8226; Assets overview (every network seen)</text>
    <text x="48" y="238">&#8226; Channel map</text>
    <text x="48" y="264">&#8226; Signal analysis</text>
    <text x="48" y="296" font-size="11" fill="#595959">No unproven items. Facts only.</text>
  </g>

  <!-- Technical column -->
  <rect x="472" y="112" width="400" height="214" rx="12" fill="#0a0a0a"/>
  <text x="492" y="138" font-size="13" font-weight="700" fill="#ffffff">Technical view</text>
  <text x="492" y="156" font-size="11" fill="#c9c9c9">everything in Simple, plus:</text>
  <g font-size="12" fill="#f2f2f2">
    <text x="492" y="186">&#8226; Posture findings (Low / Info) with beacon facts</text>
    <text x="492" y="212">&#8226; Evidence table (file names + SHA-256)</text>
    <text x="492" y="238">&#8226; Methodology and limits</text>
    <text x="492" y="264">&#8226; Diagnostic log</text>
    <text x="492" y="296" font-size="11" fill="#9a9a9a">For the engineer and the diploma review.</text>
  </g>

  <text x="28" y="346" font-size="10.5" fill="#8a8a8a">Source: cp.sh make_report, _report_view_toggle. Technical blocks carry the tech-only class.</text>
</svg>
